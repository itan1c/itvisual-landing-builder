<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- artifact:head:start -->
<title>Рыбный Замес</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first one-screen arcade. HUD on top, live water scene in the middle, mobile-game tab bar at the bottom.
   Night-lake palette: deep teal water, bone text, bobber orange as the single accent. Committed single dark theme. */
:root{
  --deep:#06151d; --water:#0b2733; --panel:#10333f; --panel-2:#164251; --panel-3:#1d5265;
  --line:rgba(236,228,210,.13); --line-2:rgba(236,228,210,.26);
  --ink:#ece4d2; --ink-dim:#a3b6bb; --ink-faint:#6f878d;
  --bob:#ff6a2b; --bob-2:#ffb547; --ok:#5fcf8a; --bad:#ff5a6e; --info:#5aa9ff;
  --font-display:'Unbounded','Rubik',system-ui,sans-serif;
  --font-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --nav-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--ink);font:15px/1.4 var(--font-body);-webkit-text-size-adjust:100%;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bob-2);outline-offset:2px}
b,strong{font-weight:700}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--water);position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  transition:transform .7s cubic-bezier(.6,-.2,.3,1.2)}
#app.flip{transform:rotate(180deg)}
#app.shake{animation:shake .32s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(3px,-2px) rotate(.4deg)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,3px) rotate(-.4deg)}100%{transform:translate(0,0)}}
#app.flip.shake{animation:shakeflip .32s infinite}
@keyframes shakeflip{0%{transform:rotate(180deg) translate(0,0)}50%{transform:rotate(180.6deg) translate(-3px,2px)}100%{transform:rotate(180deg) translate(0,0)}}

/* HUD */
#hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;line-height:1;white-space:nowrap;max-width:40%;overflow:hidden;text-overflow:ellipsis}
.chip span{overflow:hidden;text-overflow:ellipsis}
.coins{font-family:var(--font-mono);font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;transition:transform .15s}
.coins.pop{transform:scale(1.15);color:var(--bob-2)}
#event-bar{flex:none;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(255,106,43,.22),rgba(255,181,71,.12));border:1px solid rgba(255,181,71,.35);border-radius:10px;padding:7px 10px;font-size:13px;margin-bottom:8px}
#event-bar .ev-bar{height:4px;flex:1;background:rgba(236,228,210,.15);border-radius:2px;overflow:hidden;min-width:40px}
#event-bar .ev-bar i{display:block;height:100%;background:var(--bob-2);width:100%;transform-origin:left}
#event-bar b{white-space:nowrap}
#event-bar small{color:var(--ink-dim);display:block;line-height:1.2}
#event-bar .ev-text{min-width:0;flex:1}
#curse-bar{flex:none;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.curse-chip{font-size:12px;background:rgba(177,76,255,.18);border:1px solid rgba(177,76,255,.45);border-radius:999px;padding:4px 9px}

/* Views */
#views{flex:1;min-height:0;position:relative}
.view{height:100%;overflow-y:auto;overflow-x:hidden;padding-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.view h2{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em;margin:14px 0 10px;text-wrap:balance}
.view h2:first-child{margin-top:4px}
.view h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);margin:16px 0 8px;font-weight:500}

/* Scene */
#play{user-select:none;-webkit-user-select:none;touch-action:none}
#scene{position:relative;height:clamp(220px,38vh,340px);border-radius:var(--r);overflow:hidden;background:#0a3344;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
#scene.reeling .status{left:54px;right:80px}
#scene.duel .status{right:150px}
#scene.bite{box-shadow:0 0 0 3px var(--bob),inset 0 0 40px rgba(255,106,43,.35)}
#scene.win{box-shadow:0 0 0 3px var(--ok)}
#scene.lose{box-shadow:0 0 0 3px var(--bad)}
#cv{display:block;width:100%;height:100%}
.status{position:absolute;left:10px;top:10px;right:10px;text-align:left;font-size:13px;color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;display:flex;flex-direction:column;gap:2px}
.status b{font-family:var(--font-display);font-size:14px;font-weight:500}
.status.alert b{color:var(--bob-2);font-size:20px;font-weight:800;animation:pulse .35s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.bite-mark{position:absolute;left:58%;top:22%;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:800;font-size:46px;color:var(--bob-2);text-shadow:0 0 18px rgba(255,181,71,.8),0 2px 0 #000;animation:bang .25s infinite alternate;pointer-events:none}
@keyframes bang{from{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}to{transform:translate(-50%,-50%) scale(1.25) rotate(6deg)}}
#duel-badge{position:absolute;right:10px;top:10px;background:rgba(6,21,29,.75);border:1px solid var(--line-2);border-radius:10px;padding:6px 9px;font-size:12px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(4px)}
#duel-badge b{font-family:var(--font-display);font-weight:500}
#duel-badge button{color:var(--ink-dim);font-size:14px;padding:2px 4px}

/* Reel minigame */
#reel{position:absolute;inset:0;display:grid;grid-template-columns:28px 1fr 56px;gap:12px;padding:14px 14px 14px 14px;pointer-events:none}
#reel .prog{align-self:stretch;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid var(--line-2);position:relative;overflow:hidden}
#reel .prog i{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(0deg,var(--ok),#b7f5cf);transition:height .08s linear}
#reel .prog.low i{background:linear-gradient(0deg,var(--bad),#ffb3bd)}
#reel .mid{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;min-width:0}
#reel .hint{font-size:12px;color:var(--ink);text-shadow:0 1px 2px #000;background:rgba(6,21,29,.55);padding:6px 8px;border-radius:8px;max-width:100%}
#reel .fishcard{font-size:13px;background:rgba(6,21,29,.65);padding:6px 9px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;gap:8px}
#reel .fishcard .em{font-size:22px}
#reel .track{position:relative;border-radius:14px;background:rgba(0,0,0,.45);border:1px solid var(--line-2);overflow:hidden}
#reel .zone{position:absolute;left:3px;right:3px;background:rgba(95,207,138,.55);border:2px solid var(--ok);border-radius:10px;box-shadow:0 0 14px rgba(95,207,138,.5)}
#reel .zone.hit{background:rgba(95,207,138,.85)}
#reel .fishmark{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:28px;line-height:1;filter:drop-shadow(0 2px 2px #000)}
#reel .ticks{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 18%,rgba(236,228,210,.08) 18% 20%)}

/* Action row */
#action-row{display:flex;gap:10px;margin-top:10px}
.btn-big{flex:1;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.01em;background:var(--bob);color:#1a0b04;border-radius:var(--r);padding:16px 12px;box-shadow:0 6px 0 #b8431a,0 10px 20px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;text-align:center}
.btn-big:active{transform:translateY(4px);box-shadow:0 2px 0 #b8431a}
.btn-big.hold{background:var(--ok);box-shadow:0 6px 0 #2d8a52}
.btn-big.hold:active{box-shadow:0 2px 0 #2d8a52}
.btn-big.hook{background:var(--bob-2);box-shadow:0 6px 0 #b77a1a;animation:pulse .3s infinite alternate}
.btn-big:disabled{opacity:.55;transform:none;box-shadow:0 6px 0 #6b3a25}
#gear-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.gear{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.gear small{color:var(--ink-dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.gear b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-dim)}
#log div{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line)}
#log div:first-child{color:var(--ink)}
#log .r{margin-left:auto;font-family:var(--font-mono);white-space:nowrap}

/* Cards & lists */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card + .card{margin-top:8px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row > .grow{flex:1;min-width:0}
.title{font-weight:700}
.sub{color:var(--ink-dim);font-size:13px}
.em{font-size:28px;line-height:1;flex:none;width:40px;text-align:center}
.btn{background:var(--panel-3);border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-weight:500;font-size:14px;white-space:nowrap;transition:background .1s}
.btn:active{background:var(--panel-2)}
.btn.primary{background:var(--bob);color:#1a0b04;border-color:transparent;font-weight:700}
.btn.ghost{background:transparent}
.btn.ok{background:var(--ok);color:#06251a;border-color:transparent;font-weight:700}
.btn:disabled{opacity:.45}
.btn.small{padding:6px 9px;font-size:13px;border-radius:8px}
.price{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid currentColor;line-height:1.4;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:rgba(0,0,0,.2);border-radius:10px;padding:8px;min-width:0}
.stat small{display:block;color:var(--ink-dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--font-mono);font-weight:700;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.toolbar .grow{flex:1}
.empty{color:var(--ink-dim);text-align:center;padding:28px 12px;border:1px dashed var(--line-2);border-radius:var(--r);line-height:1.5}
.empty .em{font-size:40px;width:auto;margin-bottom:6px}
.inv-item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.inv-item:first-child{border-top:0}
.inv-item .name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-item .meta{font-size:12px;color:var(--ink-dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inv-item .meta .tag{font-size:10px;padding:1px 6px}
.inv-item button{justify-self:end}

/* Atlas */
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fish-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.fish-card .em{font-size:32px;width:auto;margin:0 auto}
.fish-card.locked .em{filter:brightness(0) opacity(.45)}
.fish-card .nm{font-size:12px;line-height:1.25;font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em}
.fish-card .kg{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim)}
.fish-card .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%}
.zone-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 0 8px}
.zone-head h3{margin:0}
.zone-head .mono{font-size:12px;color:var(--ink-dim)}

/* Shop */
.shop-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.shop-tabs button{border-radius:999px;padding:7px 12px;border:1px solid var(--line);font-size:13px;background:var(--panel)}
.shop-tabs button.on{background:var(--ink);color:var(--deep);border-color:transparent;font-weight:700}
.spec{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim)}
.spec b{color:var(--ink);font-family:var(--font-mono);font-weight:500}

/* Friends */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .pchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-3);border-radius:999px;padding:5px 6px 5px 11px;font-size:13px}
.chips .pchip button{width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.3);font-size:12px;line-height:1}
.input{background:rgba(0,0,0,.3);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--deep);font-weight:700}
table.lb{width:100%;border-collapse:collapse;font-size:13px}
table.lb th{text-align:left;color:var(--ink-dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
table.lb td{padding:7px 6px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
table.lb td.n{font-family:var(--font-mono)}
table.lb td:first-child{width:28px;text-align:center}
.daily{border-color:rgba(255,181,71,.4);background:linear-gradient(135deg,rgba(255,181,71,.12),var(--panel))}

/* Nav */
#nav{flex:none;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--water)}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;font-size:11px;color:var(--ink-dim);position:relative;min-width:0}
#nav button .i{font-size:20px;line-height:1}
#nav button.on{color:var(--ink);background:var(--panel)}
#nav .badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--bob);color:#1a0b04;font-family:var(--font-mono);font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;line-height:1.4}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(3,10,14,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;backdrop-filter:blur(3px)}
@media (min-width:600px){#modal{align-items:center;padding:24px}}
.modal-card{width:100%;max-width:520px;max-height:min(88vh,88%);overflow-y:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@media (min-width:600px){.modal-card{border-radius:20px;padding:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-card h2{font-family:var(--font-display);font-weight:800;font-size:20px;margin:0;text-wrap:balance;letter-spacing:-.01em}
.modal-card p{margin:0;color:var(--ink-dim);line-height:1.5}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-actions .btn{flex:1;text-align:center}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.result .big{font-size:84px;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));animation:land .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
.result .nm{font-family:var(--font-display);font-weight:800;font-size:22px;text-wrap:balance}
.result .flags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.result .flag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--bob-2);color:#1a0b04}
.result .flag.new{background:var(--info);color:#061a2e}
.result .flag.rec{background:var(--ok);color:#06251a}
.result .sum{font-family:var(--font-mono);font-size:26px;font-weight:700}
.result .q{font-style:italic;color:var(--ink-dim);font-size:13px;max-width:36ch}
.rar-secret{background:linear-gradient(90deg,#fff,#ffb547,#ff5e8a,#5aa9ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rainbow 2s linear infinite;background-size:200% auto}
@keyframes rainbow{to{background-position:200% center}}
.zone-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.zone-item:first-child{border-top:0}
.zone-item .em{font-size:30px}
.zone-item.cur .title::after{content:" · тут";color:var(--ok);font-weight:400}
.rank{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rank .pos{font-family:var(--font-display);font-size:20px;font-weight:800;text-align:center}
.forfeit{background:rgba(255,90,110,.12);border:1px dashed rgba(255,90,110,.5);border-radius:12px;padding:12px;text-align:center}
.forfeit small{display:block;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;font-size:11px;margin-bottom:4px}
.forfeit b{font-size:16px}

/* Toasts */
#toasts{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;width:min(92vw,420px);align-items:center}
.toast{background:var(--ink);color:var(--deep);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:toastin .2s ease-out;max-width:100%;text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#06251a}
.toast.gold{background:var(--bob-2);color:#1a0b04}
@keyframes toastin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<!-- artifact:head:end -->
</head>
<body>
<div id="app">
  <header id="hud">
    <button class="chip" data-act="tab" data-arg="friends" title="Профиль">🎣 <span id="hud-name">Рыбак</span></button>
    <div class="coins" id="hud-coins-wrap"><span id="hud-coins">0</span> 🪙</div>
    <button class="chip" data-act="zones" title="Сменить локацию">📍 <span id="hud-zone">Пруд</span></button>
  </header>
  <div id="event-bar" hidden></div>
  <div id="curse-bar" hidden></div>

  <main id="views">
    <section class="view" id="view-fish">
      <div id="play">
        <div id="scene">
          <canvas id="cv"></canvas>
          <div class="status" id="status"><b>Нажми «Забросить»</b><span>Пруд ждёт. Карась тоже.</span></div>
          <div class="bite-mark" id="bite-mark" hidden>!</div>
          <div id="duel-badge" hidden></div>
          <div id="reel" hidden>
            <div class="prog" id="prog"><i id="progfill"></i></div>

function ac(){if(!S.sound)return null;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}catch(e){return null}}
function beep(f,dur,type='sine',g=.08,when=0){const a=ac();if(!a)return;const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(0,a.currentTime+when);v.gain.linearRampToValueAtTime(g,a.currentTime+when+.01);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+when+dur);o.connect(v).connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.02)}
const SFX={
  cast(){beep(520,.12,'triangle',.05);beep(380,.18,'triangle',.05,.1)},
  bite(){beep(880,.08,'square',.07);beep(1180,.1,'square',.07,.09);try{navigator.vibrate&&navigator.vibrate([40,30,60])}catch(e){}},
  win(t){[523,659,784,1046].forEach((f,i)=>beep(f,.16,'triangle',.07,i*.08));if(t>=4)[1318,1568,2093].forEach((f,i)=>beep(f,.3,'sine',.06,.4+i*.1))},
  lose(){beep(300,.25,'sawtooth',.05);beep(180,.4,'sawtooth',.05,.15)},
  coin(){beep(1500,.06,'square',.04);beep(2000,.08,'square',.04,.05)},
  curse(){[400,300,200,120].forEach((f,i)=>beep(f,.2,'sawtooth',.06,i*.12))},
  tick(){beep(1000,.03,'square',.03)},
};

/* ===================== daily ===================== */
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dailyTarget(){
  const day=todayStr();
  if(S.daily.date!==day){S.daily.date=day;S.daily.done=false;save()}
  const rng=mulberry(hashStr('zames-'+day));
  const pool=FISH.filter(f=>f.z<=2&&RARITY[f.r].t>=0&&RARITY[f.r].t<=3);
  const f=pool[Math.floor(rng()*pool.length)];
  const reward=Math.round(Math.max(150,f.base*10));
  return{f,reward,day};
}

/* ===================== fishing core ===================== */
function rollFish(){
  const z=S.zone,L=luck(),rod=curRod(),ev=curEvent;
  const pool=FISH.filter(f=>f.z===z);
  const ws=pool.map(f=>{
    const R=RARITY[f.r];let w=RAR_W[f.r];
    if(f.r==='trash'){w=w/(1+L)*(rod.trash||1)*(ev?.trashX||1);if(f.curse)w*=.25}
    else{w*=Math.pow(1+L*.5,R.t);if(f.r==='mythic'&&ev?.mythX)w*=ev.mythX}
    w/=pool.filter(g=>g.r===f.r).length;
    return w;
  });
  return weighted(pool,ws);
}
function rollMut(f){
  if(f.r==='trash')return null;
  const bait=curBait(),ev=curEvent;
  const items=[null,...MUT];
  const ws=[160,...MUT.map(m=>m.w*bait.mut*(ev?.mut?.[m.id]||1)*(S.zone===3&&m.id==='ice'?3:1)*(S.zone===4&&m.id==='rad'?2:1)*(S.zone===5&&m.id==='ghost'?3:1))];
  return weighted(items,ws);
}
function rollKg(f,mut){
  let kg=f.min+(f.max-f.min)*Math.pow(Math.random(),1.8);
  if(mut?.kg)kg*=mut.kg;
  if(curEvent?.kgRare&&RARITY[f.r].t>=2)kg*=curEvent.kgRare;
  return Math.round(kg*1000)/1000;
}
function priceOf(f,kg,mut){
  if(f.r==='trash')return ri(1,3);
  const avg=(f.min+f.max)/2;
  const p=f.base*Math.pow(kg/avg,.7)*(mut?mut.m:1)*(curEvent?.price||1);
  return Math.max(1,Math.round(p));
}
function biteDelay(){const r=curRod().bite;let t=rnd(r[0],r[1]);t*=(curBait().bite||1)*(curEvent?.bite||1);return t*1000}

function cast(){
  if(phase!=='idle')return;
  if(!duel&&S.inv.length>=bagCap()){toast('Рюкзак полон. Продай улов у Петровича','bad');setTab('bag');return}
  const b=curBait();
  if(!duel&&b.id!=='worm'){if((S.baits[b.id]||0)<=0){S.bait='worm';toast('Наживка кончилась, ловим на червяка');renderHUD()}else{S.baits[b.id]--}}
  phase='casting';castAt=performance.now();S.stats.casts++;save();

    setStatus('Ждём поклёвку…','Когда дёрнется — жми куда угодно.');
    biteTimer=setTimeout(onBite,biteDelay());
  },650);

}
function onBite(){
  if(phase!=='waiting')return;
  const f=rollFish();const mut=rollMut(f);
  hooked={f,mut,t:RARITY[f.r].t};
  phase='bite';

}
function missed(){
  if(phase!=='bite')return;
  clearTimeout(biteTimer);
  const was=hooked;hooked=null;S.stats.missed++;S.stats.streak=0;save();
  endCast('lose');
  logLine('💨 Прозевал поклёвку'+(was.t>=4?' <b>чего-то легендарного</b>':''),'');
  setStatus('Прозевал…','Рыба уплыла, пока ты моргал.');

}
function hook(){
  if(phase!=='bite')return;
  clearTimeout(biteTimer);
  $('#bite-mark').hidden=true;$('#scene').classList.remove('bite');
  startReel();
}
function startReel(){
  phase='reel';
  const f=hooked.f,R=RARITY[f.r],rod=curRod(),bait=curBait();
  let z=rod.zone*(bait.zone||1);if(hasCurse('tiny'))z*=.5;z=Math.max(.1,z);
  const diff=R.diff*(curEvent?.diff||1)*(hooked.mut?.id==='jacked'?1.3:1)*(hooked.mut?.id==='giant'?1.15:1);
  const now=performance.now();
  reel={z,p:.5,v:0,f:.5,tgt:.5,next:0,prog:.3,diff,spd:1.4+diff*.9,drain:.2*rod.drain*Math.pow(diff,.7),gain:.3,last:now};
  const rl=$('#reel');rl.hidden=false;$('#scene').classList.add('reeling');
  const hidden=f.r==='secret'||f.r==='mythic';
  $('#reel-fish').innerHTML=`<span class="em">${hidden?'❓':f.e}</span><span>${hidden?'<b>Что-то огромное…</b>':'<b>'+esc(f.n)+'</b>'}<br>${rarTag(f.r)}</span>`;
  $('#fishmark').textContent=hidden?'❓':f.e;
  const inv=!!(curEvent?.invert)!==hasCurse('invert');
  $('#reel-hint').textContent=inv?'ВНИМАНИЕ: управление перевёрнуто. Зажми, чтобы зона ТОНУЛА.':'Зажми экран: зона всплывает. Отпусти: тонет. Держи рыбу в зелёном.';
  $('#btn-cast').textContent='ДЕРЖИ';$('#btn-cast').classList.remove('hook');$('#btn-cast').classList.add('hold');
  setStatus('Вываживай!','Зажми и отпускай. Не паникуй.');
  requestAnimationFrame(stepReel);
}
function stepReel(now){
  if(phase!=='reel'||!reel)return;
  const r=reel;let dt=Math.min(.05,(now-r.last)/1000);r.last=now;
  const inv=!!(curEvent?.invert)!==hasCurse('invert');
  const up=inv?!holding:holding;
  r.v+=(up?2.6:-2.6)*dt;r.v*=Math.max(0,1-1.5*dt);r.p+=r.v*dt;
  const h=r.z/2;
  if(r.p<h){r.p=h;if(r.v<0)r.v=-r.v*.25}
  if(r.p>1-h){r.p=1-h;if(r.v>0)r.v=-r.v*.25}
  r.next-=dt;if(r.next<=0){r.tgt=Math.random();r.next=rnd(.35,1.3)/Math.max(1,r.diff*.8)}
  if(r.diff>=1.9&&Math.random()<.6*dt)r.f=clamp(r.f+rnd(-.3,.3),0,1);
  r.f+=(r.tgt-r.f)*Math.min(1,dt*r.spd);
  const inside=Math.abs(r.f-r.p)<h;
  r.prog+=(inside?r.gain:-r.drain)*dt;
  const zone=$('#zone');zone.style.top=((1-(r.p+h))*100)+'%';zone.style.height=(r.z*100)+'%';zone.classList.toggle('hit',inside);
  $('#fishmark').style.top=((1-r.f)*100)+'%';
  const pf=$('#progfill');pf.style.height=(clamp(r.prog,0,1)*100)+'%';$('#prog').classList.toggle('low',r.prog<.25);
  if(r.prog>=1){finishReel(true);return}
  if(r.prog<=0){finishReel(false);return}
  requestAnimationFrame(stepReel);
}
function finishReel(win){
  $('#reel').hidden=true;reel=null;
  const h=hooked;hooked=null;
  if(win)caught(h);else lost(h);
}
function endCast(cls){
  phase='idle';holding=false;
  const sc=$('#scene');sc.classList.remove('bite','reeling');sc.classList.add(cls);setTimeout(()=>sc.classList.remove(cls),500);
  $('#bite-mark').hidden=true;
  const b=$('#btn-cast');b.disabled=false;b.textContent='Забросить';b.classList.remove('hook','hold');
}
function lost(h){
  S.stats.lost++;S.stats.streak=0;save();
  endCast('lose');
  SFX.lose();
  const big=h.t>=4;
  logLine(`💔 Сорвалась: ${big?'<b>'+esc(h.f.n)+'</b>':esc(h.f.n)}`);
  setStatus('Сорвалась!',pick(QUOTES_LOSE));
  if(big)toast('Ты упустил '+h.f.n+'. Друзья будут смеяться.','bad');
  castDone('lost',null);
}
function caught(h){
  const f=h.f,mut=h.mut;
  const kg=rollKg(f,mut);const price=priceOf(f,kg,mut);
  const item={id:S.nextId++,f:f.id,kg,mut:mut?mut.id:null,price,at:Date.now()};
  const flags=[];
  if(f.r==='trash'){S.stats.trash++;S.stats.streak=0}else{S.stats.catches++;S.stats.streak++;if(S.stats.streak>S.stats.bestStreak)S.stats.bestStreak=S.stats.streak}
  if(f.r==='secret')S.stats.secrets++;
  // atlas
  const a=S.atlas[f.id];
  if(!a){S.atlas[f.id]={n:1,best:kg,mut:item.mut};if(f.r!=='trash')flags.push({c:'new',t:'Новая в атласе'})}
  else{a.n++;if(kg>a.best){a.best=kg;a.mut=item.mut;if(f.r!=='trash')flags.push({c:'rec',t:'Рекорд вида'})}}
  if(f.r!=='trash'){
    if(!S.stats.bestKg||kg>S.stats.bestKg.kg){S.stats.bestKg={f:f.id,kg,mut:item.mut};if(S.stats.casts>3)flags.push({c:'rec',t:'Самая тяжёлая'})}
    if(!S.stats.bestPrice||price>S.stats.bestPrice.price){S.stats.bestPrice={f:f.id,kg,mut:item.mut,price};if(S.stats.casts>3)flags.push({c:'rec',t:'Самая дорогая'})}
  }
  if(mut)flags.push({c:'',t:mut.n});
  // daily
  const dl=dailyTarget();let dailyHit=false;
  if(!duel&&!S.daily.done&&dl.f.id===f.id){S.daily.done=true;S.daily.count++;S.coins+=dl.reward;dailyHit=true;flags.push({c:'',t:'Цель дня +'+fmt(dl.reward)})}
  // where it goes
  if(duel){const pl=duel.players[duel.i];pl.score+=price;pl.catches++;if(!pl.best||price>pl.best.price)pl.best={f:f.id,kg,mut:item.mut,price}}
  else S.inv.push(item);
  save();
  endCast('win');
  SFX.win(h.t);
  if(dailyHit){SFX.coin();coinsPop()}
  logLine(`${f.e} ${esc(f.n)} · ${fkg(kg)}${mut?' · '+mut.n:''}`,`${fmt(price)} 🪙`);
  setStatus('Поймал!',pick(QUOTES_WIN));
  // curse trigger
  let curse=null;
  if(f.curse||mut?.curse){if(f.curse||Math.random()<.5)curse=applyCurse()}
  showResult(item,f,mut,flags,curse);
  renderHUD();
  castDone('caught',item);
}
function showResult(item,f,mut,flags,curse){
  const R=RARITY[f.r];
  const nmCls=f.r==='secret'?'nm rar-secret':'nm';
  openModal(`
    <div class="result">
      <div class="big">${f.e}</div>
      <div class="${nmCls}">${esc(f.n)}</div>
      <div>${rarTag(f.r)} ${mutTag(mut)}</div>
      <div class="sum">${fkg(item.kg)} · ${fmt(item.price)} 🪙</div>
      ${flags.length?`<div class="flags">${flags.map(x=>`<span class="flag ${x.c}">${esc(x.t)}</span>`).join('')}</div>`:''}
      <div class="q">${esc(f.d)}</div>
      ${curse?`<div class="forfeit" style="width:100%"><small>Проклятие!</small><b>${curse.e} ${curse.n}</b><div class="sub">${curse.d} ${curse.dur} секунд.</div></div>`:''}
      ${duel?`<div class="sub">Дуэль: ${esc(duel.players[duel.i].n)} +${fmt(item.price)}</div>`:''}
    </div>
    <div class="modal-actions">
      ${f.r!=='trash'&&!duel?`<button class="btn" data-act="share-catch" data-arg="${item.id}">Похвастаться</button>`:''}
      <button class="btn primary" data-act="close-cast">Ещё заброс</button>
    </div>`);
}

function sellItems(items){
  if(!items.length)return;
  const sum=items.reduce((s,i)=>s+i.price,0);

  const p=duel.players[duel.i];p.casts--;

  if(duel.i<duel.players.length-1){
    duel.i++;const nx=duel.players[duel.i];renderDuelBadge();
    queueModal(`<h2>Передай телефон</h2><p>У ${esc(p.n)} забросы кончились, в счёте <b class="mono">${fmt(p.score)} 🪙</b>. Теперь ловит:</p><div class="forfeit"><small>Ход</small><b>${esc(nx.n)}</b></div>

function duelFinish(){
  const ps=[...duel.players].sort((a,b)=>b.score-a.score);
  const winner=ps[0],loser=ps[ps.length-1];
  const forfeit=pick(FORFEITS);
  for(const p of duel.players){
    const fr=S.friends[p.n]||(S.friends[p.n]={wins:0,plays:0,best:null});
    fr.plays++;if(p===winner)fr.wins++;
    if(p.best&&(!fr.best||p.best.price>fr.best.price))fr.best=p.best;
  }
  S.bait=duel.savedBait||'worm';if(S.bait!=='worm'&&!(S.baits[S.bait]>0))S.bait='worm';
  const tie=ps.length>1&&ps[0].score===ps[1].score;
  duel=null;save();renderDuelBadge();renderHUD();
  queueModal(`<h2>${tie?'Ничья. Серьёзно?':'Побеждает '+esc(winner.n)+'!'}</h2>
    <div class="card" style="padding:4px 12px">${ps.map((p,i)=>`<div class="rank"><span class="pos">${['🥇','🥈','🥉'][i]||i+1}</span><div style="min-width:0"><div class="title">${esc(p.n)}</div><div class="sub">${p.catches} ${plural(p.catches,'рыба','рыбы','рыб')}${p.best?' · лучшая: '+FISH_BY_ID[p.best.f].e+' '+esc(FISH_BY_ID[p.best.f].n):''}</div></div><b class="mono">${fmt(p.score)} 🪙</b></div>`).join('')}</div>

  SFX.win(4);
}

  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,fallback);else fallback();
}

function openDaily(){
  const dl=dailyTarget();
  openModal(`<div class="result"><div class="big">${dl.f.e}</div><div class="nm">Цель дня: ${esc(dl.f.n)}</div><div>${rarTag(dl.f.r)}</div><div class="q">Водится: ${ZONES[dl.f.z].e} ${ZONES[dl.f.z].n}. Награда <b class="mono">${fmt(dl.reward)} 🪙</b>. Цель одна на всех, у кого открыта игра сегодня. Кто первый скинет скрин в чат, тот и молодец.</div>${S.daily.done?'<div class="flag rec" style="padding:6px 12px;border-radius:999px;background:var(--ok);color:#06251a;font-weight:700">Сегодня выполнено</div>':''}</div><div class="modal-actions"><button class="btn primary" data-act="close">Понял</button></div>`);
}
function intro(){
  openModal(`<h2>Рыбный Замес</h2>
    <p>Кидай, жди, подсекай, вываживай. Продавай Петровичу, покупай снасти, открывай локации. Собери атлас. Ищи секретных.</p>
    <div class="card" style="gap:6px">
      <div class="row"><span class="em">🎣</span><div><b>Заброс.</b> Жми кнопку и жди. Когда поплавок дёрнется — жми куда угодно, быстро.</div></div>
      <div class="row"><span class="em">🟩</span><div><b>Вываживание.</b> Зажми экран: зелёная зона всплывает. Отпусти: тонет. Держи рыбу внутри, пока полоска не заполнится.</div></div>
      <div class="row"><span class="em">🥾</span><div><b>Проклятия.</b> Поймал Проклятый Ботинок — экран перевернётся или затрясёт. Это нормально. Это смешно.</div></div>
      <div class="row"><span class="em">🍻</span><div><b>Тусовка.</b> Дуэль «передай телефон», фанты для проигравшего, общая цель дня.</div></div>
    </div>
    <div class="row"><input class="input" id="intro-name" placeholder="Как тебя звать, рыбак?" maxlength="18" aria-label="Твоё имя"></div>
    <div class="modal-actions"><button class="btn primary" data-act="intro-done">К воде</button></div>`);
}

/* ===================== actions ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,arg=el.dataset.arg;
  switch(act){
    case 'tab':setTab(arg);break;
    case 'close':closeModal();break;
    case 'close-cast':closeModal();if(phase==='idle'&&$('#modal').hidden)cast();break;
    case 'close-friends':closeModal();setTab('friends');break;
    case 'zones':openZones();break;
    case 'baits':openBaits();break;
    case 'daily':openDaily();break;
    case 'shop-baits':closeModal();shopTab='baits';setTab('shop');break;
    case 'shoptab':shopTab=arg;renderShop();break;
    case 'sell-one':{const i=S.inv.find(x=>x.id===+arg);if(i)sellItems([i]);break}
    case 'sell-all':sellItems([...S.inv]);break;
    case 'sell-trash':sellItems(S.inv.filter(i=>FISH_BY_ID[i.f].r==='trash'));break;
    case 'sell-dupes':{const best={};for(const i of S.inv){if(!best[i.f]||i.price>best[i.f].price)best[i.f]=i}const keep=new Set(Object.values(best).map(i=>i.id));sellItems(S.inv.filter(i=>!keep.has(i.id)));break}
    case 'buy-rod':{const r=ROD_BY_ID[arg],p=salePrice(r.p);if(S.coins<p)return toast('Не хватает монет','bad');S.coins-=p;S.rods.push(r.id);S.rod=r.id;save();SFX.coin();coinsPop();toast('Новая удочка: '+r.n,'ok');renderHUD();renderShop();break}
    case 'equip-rod':S.rod=arg;save();renderHUD();renderShop();break;
    case 'buy-bait':{const b=BAIT_BY_ID[arg],p=salePrice(b.p);if(S.coins<p)return toast('Не хватает монет','bad');S.coins-=p;S.baits[b.id]=(S.baits[b.id]||0)+b.pack;if(S.bait==='worm')S.bait=b.id;save();SFX.coin();coinsPop();renderHUD();renderShop();break}
    case 'equip-bait':{if(duel)return toast('В дуэли все ловят на червяка','bad');S.bait=arg;save();renderHUD();closeModal();if(tab==='shop')renderShop();break}
    case 'buy-zone':{const z=ZONES[+arg],p=salePrice(z.p);if(S.coins<p)return toast('Не хватает монет','bad');if(duel)return toast('Сначала закончи дуэль','bad');S.coins-=p;S.zones.push(z.id);S.zone=z.id;save();SFX.coin();coinsPop();toast('Открыто: '+z.n,'ok');closeModal();renderHUD();if(tab==='shop')renderShop();if(tab==='fish'&&phase!=='idle')cancelCast();break}
    case 'go-zone':{if(duel)return toast('В дуэли локацию не меняют','bad');S.zone=+arg;save();closeModal();renderHUD();if(phase!=='idle')cancelCast();setStatus(ZONES[S.zone].n,ZONES[S.zone].d);if(tab==='shop')renderShop();break}
    case 'buy-bag':{const b=BAGS[S.bag+1];if(!b)return;const p=salePrice(b.p);if(S.coins<p)return toast('Не хватает монет','bad');S.coins-=p;S.bag++;save();SFX.coin();coinsPop();toast('Теперь '+b.cap+' слотов','ok');renderHUD();renderShop();break}
    case 'fish-info':fishInfo(arg);break;
    case 'save-name':{const v=$('#name-input').value.trim();if(v){S.name=v.slice(0,18);save();renderHUD();toast('Теперь ты '+S.name)}break}
    case 'toggle-sound':S.sound=!S.sound;save();renderFriends();break;
    case 'share-catch':shareCatch(+arg);break;
    case 'share-profile':shareProfile();break;
    case 'share-duel':{const [w,s,l,f]=arg.split('|');copyText(`⚔️ Дуэль в Рыбном Замесе: победил ${w} с уловом на ${fmt(+s)} монет. ${l} проиграл и теперь: ${f}`);break}
    case 'forfeit':{const b=$('#forfeit-box');b.innerHTML=`<small>Фант</small><b>${esc(pick(FORFEITS))}</b>`;SFX.tick();break}
    case 'duel-add':{const inp=$('#duel-name');const v=inp.value.trim().slice(0,16);if(!v)return;if(v===S.name||duelSetup.names.includes(v))return toast('Такой уже есть','bad');if(duelSetup.names.length>=5)return toast('Максимум 6 игроков','bad');duelSetup.names.push(v);renderFriends();$('#duel-name').focus();break}
    case 'duel-rm':duelSetup.names.splice(+arg,1);renderFriends();break;
    case 'duel-per':duelSetup.per=+arg;renderFriends();break;
    case 'duel-start':if(phase!=='idle')cancelCast();duelStart();break;
    case 'duel-again':closeModal();setTab('friends');duelStart();break;
    case 'duel-quit':duelQuit();break;
    case 'duel-quit-yes':{if(duel){S.bait=duel.savedBait||'worm';if(S.bait!=='worm'&&!(S.baits[S.bait]>0))S.bait='worm'}duel=null;if(phase!=='idle')cancelCast();closeModal();renderDuelBadge();renderHUD();toast('Дуэль отменена');break}
    case 'intro-done':{const v=$('#intro-name').value.trim();if(v)S.name=v.slice(0,18);S.seenIntro=true;save();closeModal();renderHUD();break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='duel-name'){e.preventDefault();$('[data-act="duel-add"]')?.click()}if(e.key==='Enter'&&e.target.id==='name-input'){e.preventDefault();$('[data-act="save-name"]')?.click()}if(e.key==='Enter'&&e.target.id==='intro-name'){e.preventDefault();$('[data-act="intro-done"]')?.click()}if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&phase==='idle')closeModal()});
function cancelCast(){clearTimeout(biteTimer);clearTimeout(castTimer);reel=null;hooked=null;$('#reel').hidden=true;endCast('lose');setStatus('Нажми «Забросить»','')}

/* input: cast button, hold anywhere in play area, space key */
$('#btn-cast').addEventListener('click',()=>{if(phase==='idle')cast()});
const play=$('#play');
function pressDown(e){
  if(e&&e.pointerType!==undefined&&e.button>0)return;
  ac();
  if(phase==='bite'){holding=true;hook();return}
  if(phase==='reel'){holding=true;return}
  if(phase==='waiting'&&e&&e.target.closest('#scene'))setStatus('Ждём поклёвку…','Рано. Терпение, рыбак.');
}
function pressUp(){holding=false}
play.addEventListener('pointerdown',e=>{pressDown(e)});
window.addEventListener('pointerup',pressUp);window.addEventListener('pointercancel',pressUp);window.addEventListener('blur',pressUp);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();if(phase==='idle'&&$('#modal').hidden&&tab==='fish')cast();else pressDown(null)}});
document.addEventListener('keyup',e=>{if(e.code==='Space')pressUp()});
play.addEventListener('contextmenu',e=>e.preventDefault());

/* ===================== canvas scene ===================== */
const cv=$('#cv'),cx=cv.getContext('2d');let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);cx.setTransform(dpr,0,0,dpr,0,0);W=r.width;H=r.height}
window.addEventListener('resize',resize);
const amb=[];for(let i=0;i<5;i++)amb.push({x:Math.random(),y:.5+Math.random()*.45,v:(.02+Math.random()*.04)*(Math.random()<.5?1:-1),s:12+Math.random()*10,o:.25+Math.random()*.3});
let ripples=[],splash=[];
function draw(t){
  if(!W||document.hidden){requestAnimationFrame(draw);return}
  const z=ZONES[S.zone],[s1,s2,w1,w2]=z.pal;const hz=H*.4;
  let g=cx.createLinearGradient(0,0,0,hz);g.addColorStop(0,s1);g.addColorStop(1,s2);cx.fillStyle=g;cx.fillRect(0,0,W,hz+2);
  // sun / moon
  cx.beginPath();cx.arc(W*.8,hz*.45,S.zone===5?10:18,0,7);cx.fillStyle=z.sun;cx.globalAlpha=S.zone===5?.4:.9;cx.fill();cx.globalAlpha=1;
  if(S.zone===1||S.zone===3||S.zone===5){cx.fillStyle='rgba(255,255,255,.7)';const rg=mulberry(7);for(let i=0;i<26;i++){cx.globalAlpha=.3+.6*Math.abs(Math.sin(t*.001+i));cx.fillRect(rg()*W,rg()*hz*.8,1.5,1.5)}cx.globalAlpha=1}
  if(S.zone===1){cx.fillStyle='rgba(0,0,0,.55)';for(let i=0;i<9;i++){const bw=W/9,bh=hz*(.25+((i*37)%50)/100);cx.fillRect(i*bw,hz-bh,bw-3,bh)}cx.fillStyle='rgba(255,220,120,.5)';for(let i=0;i<30;i++){cx.fillRect((i*53)%W,hz-((i*29)%60)-8,3,3)}}
  if(S.zone===4){cx.fillStyle='rgba(60,10,5,.9)';cx.beginPath();cx.moveTo(0,hz);cx.lineTo(W*.3,hz*.3);cx.lineTo(W*.5,hz);cx.closePath();cx.fill();cx.fillStyle='#ff6a2b';cx.fillRect(W*.29,hz*.3,W*.02,4)}
  if(S.zone===3){cx.fillStyle='rgba(220,240,255,.85)';cx.beginPath();cx.moveTo(0,hz);cx.lineTo(W*.12,hz*.55);cx.lineTo(W*.3,hz);cx.closePath();cx.fill()}
  g=cx.createLinearGradient(0,hz,0,H);g.addColorStop(0,w1);g.addColorStop(1,w2);cx.fillStyle=g;cx.fillRect(0,hz,W,H-hz);
  // ambient fish
  cx.font='16px serif';cx.textBaseline='middle';
  for(const a of amb){a.x+=a.v*(1/60);if(a.x>1.1)a.x=-.1;if(a.x<-.1)a.x=1.1;cx.globalAlpha=a.o;cx.save();cx.translate(a.x*W,hz+(H-hz)*a.y+Math.sin(t*.002+a.s)*3);if(a.v>0)cx.scale(-1,1);cx.font=a.s+'px serif';cx.fillText('🐟',0,0);cx.restore()}
  cx.globalAlpha=1;
  // waves
  for(let i=0;i<3;i++){cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W;x+=6){const y=hz+i*9+Math.sin(x*.02+t*.0015*(i+1)+i*2)*4+Math.sin(x*.047-t*.001)*2;cx.lineTo(x,y)}cx.lineTo(W,H);cx.closePath();cx.fillStyle=`rgba(236,228,210,${.05-i*.012})`;cx.fill()}
  // bobber & line
  const active=phase==='waiting'||phase==='bite'||phase==='reel'||phase==='casting';
  const bx=W*.58,surface=hz+Math.sin(bx*.02+t*.0015)*4;
  let by=surface+Math.sin(t*.003)*2;
  if(phase==='bite')by+=9+Math.random()*5;
  if(phase==='reel'&&reel)by+=6+Math.sin(t*.02)*4;
  if(phase==='casting')by=surface-(H*.5)*(1-Math.min(1,(t-castAt)/650));
  // rod
  cx.strokeStyle='rgba(236,228,210,.7)';cx.lineWidth=3;cx.beginPath();cx.moveTo(-4,H*.95);cx.lineTo(W*.18,hz*.25);cx.stroke();
  if(active){cx.strokeStyle='rgba(236,228,210,.45)';cx.lineWidth=1;cx.beginPath();cx.moveTo(W*.18,hz*.25);cx.quadraticCurveTo(W*.4,hz*.35+(phase==='reel'?-20:40),bx,by);cx.stroke();
    cx.beginPath();cx.arc(bx,by,7,Math.PI,0);cx.fillStyle='#ff5a3c';cx.fill();cx.beginPath();cx.arc(bx,by,7,0,Math.PI);cx.fillStyle='#fff';cx.fill();cx.fillStyle='#ff5a3c';cx.fillRect(bx-1,by-16,2,10);
    if(phase==='waiting'&&Math.random()<.02)ripples.push({x:bx,y:surface+2,r:4,a:.5});
    if(phase==='bite'&&Math.random()<.3)ripples.push({x:bx,y:surface+2,r:6,a:.7});
    if(phase==='reel'&&Math.random()<.5)splash.push({x:bx+rnd(-6,6),y:by,vx:rnd(-40,40),vy:rnd(-120,-40),l:1});
  }
  ripples=ripples.filter(r=>r.a>0);for(const r of ripples){r.r+=.6;r.a-=.012;cx.strokeStyle=`rgba(236,228,210,${r.a})`;cx.lineWidth=1;cx.beginPath();cx.ellipse(r.x,r.y,r.r,r.r*.35,0,0,7);cx.stroke()}
  splash=splash.filter(p=>p.l>0);for(const p of splash){p.l-=.03;p.x+=p.vx/60;p.y+=p.vy/60;p.vy+=300/60;cx.fillStyle=`rgba(236,228,210,${p.l})`;cx.fillRect(p.x,p.y,2,2)}
  requestAnimationFrame(draw);
}

/* ===================== init ===================== */
function init(){
  load();
  resize();requestAnimationFrame(draw);
  renderHUD();renderEventBar();renderDuelBadge();
  setStatus('Нажми «Забросить»',ZONES[S.zone].d);
  scheduleEvent();
  dailyTarget();
  if(!S.seenIntro)intro();
  setTimeout(resize,50);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)resize()});
  try{window.claude?.hot?.snapshot?.(()=>({}))}catch(e){}
}
try{
  if(window.claude?.hot?.ready)window.claude.hot.ready(()=>init());else init();
}catch(e){init()}
</script>
</body>
</html>
